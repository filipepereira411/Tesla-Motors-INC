<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Portugal | Veículos Elétricos e Energia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            overflow: hidden;
            background-color: #000;
        }

        /* Cabeçalho / Navegação */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            z-index: 10;
        }

        .logo svg {
            width: 120px;
            height: 18px;
            fill: #ffffff;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            text-decoration: none;
            color: #ffffff;
            font-weight: 500;
            font-size: 14px;
            padding: 6px 12px;
            border-radius: 4px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        nav a:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }

        /* Secção Principal (Hero) */
        .hero {
            position: relative;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 14vh 20px 8vh 20px;
            text-align: center;
            color: #ffffff;
        }

        /* Vídeo ou Imagem de Fundo */
        .background-media {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            filter: brightness(0.65);
        }

        .titles h1 {
            font-size: 40px;
            font-weight: 500;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            animation: fadeIn 1s ease forwards;
        }

        .titles p {
            font-size: 14px;
            animation: fadeIn 1.2s ease forwards;
        }

        .titles a {
            color: #ffffff;
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        /* Botões de Ação */
        .cta-buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 290px;
            animation: fadeIn 1.5s ease forwards;
        }

        @media (min-width: 600px) {
            .cta-buttons {
                flex-direction: row;
                max-width: 540px;
            }
        }

        .btn {
            flex: 1;
            padding: 10px 40px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.3s ease;
            text-align: center;
            text-decoration: none;
        }

        .btn-primary {
            background-color: #3e6ae1;
            color: #ffffff;
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.65);
            color: #171a20;
        }

        .btn:hover {
            opacity: 0.85;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <!-- Logótipo Vetorial Oficial da Tesla -->

            </svg>
        </div>
        <nav>
            <a href="#">Model Y</a>
            <a href="#">Roadster</a>
            <a href="#">Robotaxi</a>
            <a href="#">Semi</a>
        </nav>
    </header>

    <main class="hero">
        <!-- Vídeo demonstrativo futurista em loop (pode substituir por uma imagem se preferir) -->
        <video class="background-media" autoplay muted loop playsinline>
            <source src="https://tesla.com" type="video/mp4">
        </video>

        <div class="titles">
            <h1>Model Y</h1>
            <p>Entrega prevista para Novembro de 2026. <a href="#">Ver detalhes da encomenda</a></p>
        </div>

        <div class="cta-buttons">
            <a href="#" class="btn btn-primary">Encomenda Personalizada</a>
            <a href="#" class="btn btn-secondary">Explorar Inventário</a>
        </div>
    </main>

</body>
</html>
